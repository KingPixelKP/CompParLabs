services:

  spark-master:
    image: spark:python3
    container_name: spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "8080:8080"
      - "7077:7077"


  spark-worker:
    image: spark:python3

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 2
      --memory 2G

    # root so executors can write proj1 outputs into the bind-mounted repo (the image's
    # spark uid cannot, an arbitrary host uid has no passwd entry and Hadoop login fails);
    # proj1 docker runs write to out/docker, apart from the local runs' out/
    user: root

    depends_on:
      - spark-master

    volumes: #Edit when add new lab
      # proj1: whole repo at the same path as in the jupyter (driver) container
      - ..:/repo

      - ../test-project/apps:/apps/test-project
      - ../test-project/data:/data/test-project

      - ../lab01/apps:/apps/lab01
      - ../lab01/data:/data/lab01

      - ../lab02/apps:/apps/lab02
      - ../lab02/data:/data/lab02

      - ../lab03/apps:/apps/lab03

  jupyter:
    build:
      dockerfile: Dockerfile

    container_name: jupyter

    user: root

    environment:
      HOME: /tmp
      JUPYTER_CONFIG_DIR: /tmp/jupyter
      JUPYTER_RUNTIME_DIR: /tmp/jupyter/runtime
      JUPYTER_DATA_DIR: /tmp/jupyter/data
      JUPYTER_TOKEN: 1234 # This is the notebook's password

    ports:
      - "8888:8888"
      - "4040-4045:4040-4045"

    volumes: #Edit when add new lab
      # proj1: whole repo at the same path as on the workers
      - ..:/repo

      - ../test-project/notebooks:/workspace/test-project
      - ../test-project/data:/data/test-project

      - ../lab01/notebooks:/workspace/lab01
      - ../lab01/data:/data/lab01

      - ../lab02/notebooks:/workspace/lab02
      - ../lab02/data:/data/lab02

      - ../lab03/notebooks:/workspace/lab03

    working_dir: /workspace

    depends_on:
      - spark-master

    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
